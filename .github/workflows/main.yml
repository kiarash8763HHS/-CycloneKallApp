name: Build Cyclone Kall App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CycloneKallApp/CycloneKallApp.csproj

      - name: Publish EXE
        run: dotnet publish CycloneKallApp/CycloneKallApp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CycloneKallApp-Windows-x64
          path: publish/
          
